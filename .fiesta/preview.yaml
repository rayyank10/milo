# How the harness turns a branch + page into a live preview URL for Milo.
#
# Milo runs on Adobe Edge Delivery Services, where any branch is served at
# `<branch>--milo--<owner>.aem.page`. The visual gate substitutes {branch} and
# {page} into pin_pattern, then captures screenshots of the result. For this
# fork the owner is `antonio-rmrz`; `martech=off` keeps analytics out of the shot.
#
# Live capture requires the fork to be connected to AEM Code Sync.
mechanism: aem-branch-preview
pin_pattern: 'https://{branch}--milo--antonio-rmrz.aem.page{page}?martech=off'
# Content-bus pages (most real Milo pages) can't be served from a git branch;
# the milolibs overlay renders the consumer page with THIS branch's code.
# Used by visual targets that declare mechanism: overlay. Captures are
# read-only against the consumer host.
overlay_pattern: 'https://stage--milo--adobecom.aem.page{page}?milolibs={branch}--milo--antonio-rmrz&martech=off'

# Local-serve preview (preferred): run Milo's own AEM CLI dev server on the
# materialized worktree and capture localhost, instead of a remote branch
# preview. Serves the diff-applied CODE locally + proxies content from the
# content bus — so the visual gate verifies the actual change with no code-sync
# wait and no fork code-bus CORS/CDN races. `cmd` runs in the worktree;
# `--stop-other` reclaims the port across runs. NOTE: serves Milo's OWN pages
# (main--milo--adobecom paths render here); a foreign consumer page pasted in a
# ticket (da-dc/cc/bacom) has no path on this server and escalates honestly —
# multi-repo local compose for those is a separate capability.
# --url is the content origin the local server proxies. Upstream milo preview
# is public and read-only, and its pages carry real content; the fork's has only a placeholder.
local:
  cmd: 'aem up --port=6456 --no-open --stop-other --url https://main--milo--adobecom.aem.page'
  url: 'http://localhost:6456{page}'
  # Foreign consumer pages (da-dc/bacom/cc/upp — anything that CONSUMES Milo via
  # ?milolibs=): keep the page REMOTE on its public content host and source THIS
  # branch's libs from the local dev server via milolibs=local (the consumer's
  # own setLibs maps `local` → localhost:6456). No fork code-bus, no site auth
  # (public .aem.live content), no CDN races. host_swap rewrites the pasted
  # preview host (.aem.page, gated) to the public content host (.aem.live).
  # own_hosts identifies Milo's OWN hosts (any '--milo--' host): those are served
  # by the local server directly instead — milolibs=local is a no-op on Milo's
  # own host, so serving locally is what shows the diff. This path needs the
  # engine to relax browser web security (remote HTTPS importing http://localhost).
  consumer_overlay:
    own_hosts: ['--milo--']
    params: 'milolibs=local&martech=off'
    host_swap: { '.aem.page': '.aem.live' }

# Hosts that carry Milo's pages when a requester pastes a URL in the ticket.
# Milo ships as a library: real repro URLs usually live on CONSUMER sites that
# load milo via ?milolibs= — the harness renders such a URL as itself with the
# harness branch merged into its milolibs query (the page only exists on its
# own host). Entries starting with '--' are host suffixes: any branch label of
# that site (main--, stage--, …). URLs on hosts not listed here (and not on the
# pin/overlay hosts above) are treated as reference links and ignored.
#
# POLICY (operator, 2026-07-10): verification evidence comes from .aem.page,
# never .aem.live. The .live edge caches code per encoding variant for 2h
# (vs 60s on .page), so a .live capture can photograph up-to-2h-stale code —
# two MWPW-198935 runs blanked on exactly that (poisoned br variants). Pasted
# .live URLs are swapped BACK to the preview host at capture time. da-dc /
# da-bacom .page previews are IMS-gated: until the harness automation account
# is allowlisted for those sites (see auth_profiles below), captures there
# fail honestly (HTTP 401 → escalate) instead of photographing .live.
capture_hosts:
  - '--milo--adobecom.aem.page'    # milo's own upstream previews
  - '--da-dc--adobecom.aem.page'   # DC consumer pages (MWPW-198935 class)
  # bacom consumer pages (MWPW-193755 class — pasted query params like
  # country= survive the milolibs merge).
  - '--da-bacom--adobecom.aem.page'
  - host: '--da-dc--adobecom.aem.live'     # pasted publish-host URLs
    capture_on: '--da-dc--adobecom.aem.page'
  - host: '--da-bacom--adobecom.aem.live'
    capture_on: '--da-bacom--adobecom.aem.page'

# Login flows for auth-gated capture hosts, executed generically by the
# harness. Credentials are referenced by env var NAME — values live only in
# the engine environment, never in this repo. The `ims` flow is verified
# end-to-end against auth.services.adobe.com with the harness automation
# account. It is DORMANT until a capture_hosts entry attaches it via
# `auth: ims` — do that only after the automation account (IMS_EMAIL) is
# allowlisted for the site's preview access. helix site-auth hosts
# (da-dc/da-bacom .aem.page) additionally need
# login_url: https://admin.hlx.page/login/{org}/{site}/{ref} on the profile.
auth_profiles:
  ims:
    # The test account this profile signs in with. `username` is declared in
    # the clear — it is the identity a site admin must add to the da-dc /
    # da-bacom PREVIEW access allowlist (as of 2026-07-10 it is NOT yet on it:
    # admin.hlx.page/status returns 403 / permissions:null for these sites).
    # The password is read from the IMS_PASS engine env var; never in this repo.
    # Need a different/second account? Declare another profile (one each).
    account:
      username: cod23684+masautomation@adobetest.com
      password_env: IMS_PASS
      note: >-
        Allowlist this account for PREVIEW on adobecom sites da-dc and da-bacom
        (tools.aem.live / helix config service). Verify:
        admin.hlx.page/status/adobecom/da-dc/main/ returns preview.status 200
        (not 403) when signed in as this user.
    idp_hosts: [auth.services.adobe.com, ims-na1.adobelogin.com]
    steps:
      - fill: '#EmailPage-EmailField'
        value_from: username
        timeout_ms: 45000
      - click: '[data-id=EmailPage-ContinueButton]'
      - fill: '#PasswordPage-PasswordField'
        value_from: password
        timeout_ms: 60000
      - click: '[data-id=PasswordPage-ContinueButton]'
      # Multi-profile accounts land on an IMS profile chooser after password
      # (measured 2026-07-10) — pick the personal/authoring profile. Optional:
      # single-profile accounts skip straight past it.
      - click: '[data-id="PP-ProfileChooser-AuthAccount"]'
        optional: true
        timeout_ms: 8000
      - click: 'button:has-text("Skip"), [data-id="PasskeyNudgePage-SkipButton"]'
        optional: true
        timeout_ms: 8000
    settle_ms: 5000

# Known-good capture surfaces. When a ticket declares no visual_targets, the
# harness reads ONLY these ids + descriptions (progressive disclosure) and asks
# a small model which surface best exercises the change — it can only pick from
# this list, and "none fit" skips the gate honestly. Add an entry per block or
# area you want visually verifiable; `match` is an optional changed-files hint.
surfaces:
  - id: preflight
    # Locally this is the real milo homepage: real gnav, footer, and images.
    page: /
    mechanism: pin
    description: >-
      The Preflight modal (pre-publish quality checks) opened over the milo
      documentation homepage, a real page with images. Exercises
      libs/blocks/preflight — the modal chrome, nav rail / tab panels, check
      cards, asset rows, and their spacing, typography, and design-token
      styling. Its checks may show "Checking..." while running.
    match: 'libs/blocks/preflight/**'
    # Preflight opens only via the Sidekick extension's element + events; these steps
    # simulate that companion contract so milo's own wiring renders the modal (no demo page).
    # The homepage carries no c2 token sheets — the surface still catches a tokenless modal.
    interact:
      - append_element: aem-sidekick
      - dispatch_event: sidekick-ready
      # async sidekick.js import + 500ms listener debounce — give both a beat
      - wait_ms: 2000
      - dispatch_event: 'custom:preflight'
        at: aem-sidekick
      - wait_for: '#preflight'
    # Each tab is a distinct UI state judged as its own still; text= selectors survive
    # redesigns (tab labels are product terms, class names are not). Panels load async — give them a beat.
    states:
      - name: Assets tab open
        steps:
          - click: '#preflight >> text=Assets'
          - wait_ms: 2500
          # Asset rows appear when the async check finishes; skip the wait when the page has none.
          - wait_for: '#preflight >> text=Upload size'
            optional: true
      - name: Martech tab open
        steps:
          - click: '#preflight >> text=Martech'
          - wait_ms: 2500
    # Evidence only with its style context (checked at capture time; preflight.css loads with the modal).
    requires:
      - /libs/styles/styles.css
      - /libs/blocks/preflight/preflight.css

  # ── Mined from adobecom/milo merged-PR test URLs (600 PRs, 2025-10→2026-07;
  # every url probed HTTP 200 at mining time; see docs in the fiesta workspace).
  # url-surfaces render via the request-URL machinery: the page as declared,
  # with the harness branch merged into its milolibs query.
  - id: utils
    url: https://main--milo--adobecom.aem.page/?martech=off
    description: >-
      Milo core runtime (utils.js decoration, placeholders, LCP path) on the
      milo preview homepage with martech off. Generic render-smoke — pick ONLY
      when no more specific scenario or feature surface covers the change.
    match: 'libs/utils/**'
  - id: blocks-merch
    url: https://main--milo--adobecom.aem.page/drafts/rivero/merch/special-offers?martech=off
    description: >-
      Merch price/CTA inline blocks and merch modals on a merch special-offers draft page
    match: 'libs/blocks/merch/**'
  - id: c2
    url: https://main--upp--adobecom.aem.live/homepage/drafts/ramuntea/redesign-demo
    description: >-
      Spectrum-2 (s2a token) site-redesign blocks and styles on the UPP homepage redesign demo
    match: 'libs/c2/**'
  - id: mep
    url: https://www.stage.adobe.com/dc-shared/fragments/tests/2026/q2/ace1205/fragments/ace1205-bizpro-hub?mep=%2Fdc-shared%2Ffragments%2Ftests%2F2026%2Fq2%2Face1205%2Fdc1205-base-page-dc.json--all&martech=off
    description: >-
      MEP campaign fragment bundles (libs/mep/<campaign>) rendered via a dc-shared campaign fragment on stage
    match: 'libs/mep/**'
  - id: blocks-global-navigation
    url: https://main--dc--adobecom.aem.live/acrobat?martech=off
    description: >-
      Global navigation (gnav) header on the Acrobat consumer page with martech off
    match: 'libs/blocks/global-navigation/**'
  - id: features-personalization
    url: https://main--milo--adobecom.aem.page/?martech=off
    description: >-
      MEP personalization engine (manifest resolution, highlighting) on the milo preview homepage
    match: 'libs/features/personalization/**'
  - id: deps
    url: https://www.stage.adobe.com/acrobat/online/sign-pdf.html?martech=off
    description: >-
      Vendored dependencies (imslib, mas web components) exercised by the Acrobat online sign-pdf funnel page
    match: 'libs/deps/**'
  - id: blocks-caas
    url: https://main--milo--adobecom.aem.page/tools/caas
    description: >-
      CaaS card collections live-rendered inside the CaaS configurator preview
    match: 'libs/blocks/caas/**'
  - id: features-mas
    url: https://main--cc--adobecom.aem.live/drafts/rivero/products/catalog
    description: >-
      M@S catalog (merch-at-scale cards, filters, PZN modal) on the CC products catalog draft
    match: 'libs/features/mas/**'
  - id: blocks-brand-concierge
    url: https://main--milo--adobecom.aem.page/drafts/colloyd/brand-concierge/bc-floating-button
    description: >-
      Brand Concierge chat block incl. floating button entry point on its dedicated draft page
    match: 'libs/blocks/brand-concierge/**'
  - id: tools
    url: https://milo.adobe.com/tools/send-to-caas/bulkpublisher.html
    description: >-
      Repo tools pages, e.g. the send-to-CaaS bulk publisher UI on milo.adobe.com
    match: 'tools/**'
  - id: blocks-merch-card-collection-autoblock
    url: https://main--cc--adobecom.aem.live/creativecloud/plans
    description: >-
      Merch card collection autoblock on the CC Creative Cloud plans page
    match: 'libs/blocks/merch-card-collection-autoblock/**'
  - id: features-georoutingv2
    url: https://main--dc--adobecom.aem.live/acrobat?martech=off
    description: >-
      Geo-routing v2 banner/redirect logic on the Acrobat consumer page
    match: 'libs/features/georoutingv2/**'
  - id: blocks-carousel
    url: https://main--milo--adobecom.aem.page/docs/library/kitchen-sink/carousel
    description: >-
      Carousel block variants on the milo kitchen-sink carousel page
    match: 'libs/blocks/carousel/**'
  - id: blocks-section-metadata
    url: https://main--milo--adobecom.aem.page/drafts/klee/jira-ticket/mwpw-189253-ups-gap-removed-10-col?martech=off
    description: >-
      Section-metadata driven layout (grids, gaps, backgrounds) on a section-metadata regression draft
    match: 'libs/blocks/section-metadata/**'
  - id: navigation
    url: https://main--milo--adobecom.aem.page/drafts/blaishram/test-urls/page?martech=off
    description: >-
      Standalone gnav bootstrapper (libs/navigation) on the dedicated standalone test page
    match: 'libs/navigation/**'
  - id: blocks-ost
    url: https://main--milo--adobecom.aem.live/tools/ost
    description: >-
      Offer Selector Tool (OST) authoring UI page
    match: 'libs/blocks/ost/**'
  - id: blocks-caas-config
    url: https://main--milo--adobecom.aem.page/tools/caas
    description: >-
      CaaS configurator tool page (config UI plus live collection preview)
    match: 'libs/blocks/caas-config/**'
  - id: blocks-region-nav
    url: https://main--homepage--adobecom.aem.live/homepage/index-loggedout
    description: >-
      Region picker / region-nav modal via the homepage logged-out page footer
    match: 'libs/blocks/region-nav/**'
  - id: blocks-email-collection
    url: https://main--milo--adobecom.aem.page/drafts/ratko/email-collection/email-collection-kt
    description: >-
      Email collection form block on its kitchen-test draft page
    match: 'libs/blocks/email-collection/**'
  - id: blocks-hero-marquee
    url: https://main--milo--adobecom.aem.page/docs/library/kitchen-sink/hero-marquee?martech=off
    description: >-
      Hero marquee block variants on the milo kitchen-sink page
    match: 'libs/blocks/hero-marquee/**'

  # ── Scenario surfaces: a page PLUS the query params that put it in a specific
  # state worth verifying. Query params declared here survive the milolibs
  # overlay merge, so the before/after pair renders the scenario itself.
  - id: utils-locale-geo
    url: https://main--da-bacom--adobecom.aem.live/?country=fr&martech=off
    description: >-
      Locale/geo-simulation scenario: a bacom consumer homepage rendered as a
      simulated French visitor via ?country=fr. Pick for changes to country or
      locale DETECTION in the core runtime — getCountry, the ?country= /
      ?akamaiLocale= geo-simulation query params, lingo cross-site content, or
      market/locale resolution — the page's localized content resolves against
      the simulated country, so a before/after pair shows whether the parameter
      is honoured. Not for the georouting banner block (it has its own surface)
      or utils changes unrelated to locale (rendering, LCP, decoration).
    match: 'libs/utils/**'
