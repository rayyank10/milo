# How the harness turns a branch + page into a live preview URL for Milo.
#
# Milo runs on Adobe Edge Delivery Services, where any branch is served at
# `<branch>--milo--<owner>.aem.page`. The visual gate substitutes {branch} and
# {page} into pin_pattern, then captures screenshots of the result. For this
# fork the owner is `antonio-rmrz`; `martech=off` keeps analytics out of the shot.
#
# Live capture requires the fork to be connected to AEM Code Sync.
mechanism: aem-branch-preview
pin_pattern: 'https://{branch}--milo--antonio-rmrz.aem.page{page}?martech=off'
# Content-bus pages (most real Milo pages) can't be served from a git branch;
# the milolibs overlay renders the consumer page with THIS branch's code.
# Used by visual targets that declare mechanism: overlay. Captures are
# read-only against the consumer host.
overlay_pattern: 'https://stage--milo--adobecom.aem.page{page}?milolibs={branch}--milo--antonio-rmrz&martech=off'

# Hosts that carry Milo's pages when a requester pastes a URL in the ticket.
# Milo ships as a library: real repro URLs usually live on CONSUMER sites that
# load milo via ?milolibs= — the harness renders such a URL as itself with the
# harness branch merged into its milolibs query (the page only exists on its
# own host). Entries starting with '--' are host suffixes: any branch label of
# that site (main--, stage--, …). URLs on hosts not listed here (and not on the
# pin/overlay hosts above) are treated as reference links and ignored.
# da-dc's preview host is IMS-gated (401 for a headless capture); its publish
# host serves the same page publicly and still honors milolibs, so capture_on
# swaps it in at capture time.
capture_hosts:
  - '--milo--adobecom.aem.page'    # milo's own upstream previews
  - host: '--da-dc--adobecom.aem.page'   # DC consumer pages (MWPW-198935 class)
    capture_on: '--da-dc--adobecom.aem.live'

# Known-good capture surfaces. When a ticket declares no visual_targets, the
# harness reads ONLY these ids + descriptions (progressive disclosure) and asks
# a small model which surface best exercises the change — it can only pick from
# this list, and "none fit" skips the gate honestly. Add an entry per block or
# area you want visually verifiable; `match` is an optional changed-files hint.
surfaces:
  - id: preflight-demo
    page: /tools/preflight-demo.html
    mechanism: pin
    description: >-
      The Preflight modal demo tool on a standard-bootstrap milo page.
      Exercises libs/blocks/preflight — the modal chrome, tab panels, check
      items, and their spacing, typography, and design-token styling. Its
      checks show "Checking..." while running.
    match: 'libs/blocks/preflight/**'
    # The capture is evidence only if the surface loaded its style context —
    # a styleless wireframe must never reach the judge (fiesta verifies each
    # entry loaded with a non-error status).
    requires:
      - /libs/styles/styles.css
      - /libs/blocks/preflight/preflight.css
