# A Milo workflow, composed from the harness capability library.
#
# workflow_id is namespaced to `milo.restyle-block` by the harness — do not
# prefix it here. Each step names a registered handler; steps route by
# on_success / on_failure to another step id or a terminal (`complete` / `__end__`).
workflow_id: restyle-block
name: Restyle a Milo block
description: >-
  Generate a styling change to a block from an issue, then require human
  sign-off before it proceeds.
start_step: generate
steps:
  - id: generate
    handler: codegen.generate
    on_success: approve
    on_failure: __end__
  - id: approve
    handler: approval.request
    on_success: complete
    on_failure: __end__
