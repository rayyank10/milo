# How the harness (fiesta Close) renders this repo's PR body. Placeholders are
# substituted by the harness; a line whose placeholder cannot be resolved is
# replaced by its declared fallback, keeping the review-bot-required shape.
issue_key_pattern: 'MWPW-\d+'
page: /
fallbacks:
  issue_key: 'Resolves: <!-- link the MWPW Jira ticket, e.g. [MWPW-0000](…) -->'
  preview_url: '- After: <!-- branch preview unavailable — link the PR preview -->'
template: |
  {summary_bullets}

  Resolves: [{issue_key}](https://jira.corp.adobe.com/browse/{issue_key})

  **Test URLs:**
  - Before: https://stage--milo--adobecom.aem.page/?martech=off
  - After: {preview_url}
