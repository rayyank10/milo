# Milo's verification gates.
#
# When this file is present the harness runs THESE gates in place of its
# built-in default set. Each gate binds to a platform-owned template
# (command | coverage | visual) and supplies the parameters. The harness
# substitutes {changed_files} / {test_files} into commands and runs them in
# the worktree.
#
# Note: Milo's block-structure check used to be hardcoded inside the harness.
# It is re-declared here as a `command` gate so the harness can stay generic —
# nothing Milo-specific needs to live in the harness anymore.
gates:
  lint:
    template: command
    name: ESLint (no warnings)
    cmd: npx eslint {js_files} --max-warnings 0
    blocking: true
    failure_route: repair_loop

  # Milo's second eslint config flags browser APIs unsafe across its target
  # browser matrix (e.g. Array.at on old Safari) — the standard lint run does
  # not pick it up, and GitHub CI would red-x the PR after the fact.
  compat-lint:
    template: command
    name: Browser-compat ESLint
    cmd: npx --no-install eslint --no-eslintrc -c .eslintrc-code-compatibility.js {js_files} --quiet
    blocking: true
    failure_route: repair_loop

  unit-tests:
    template: command
    name: Web Test Runner unit tests
    cmd: npx web-test-runner {test_files} --node-resolve
    timeout_s: 300
    blocking: true
    failure_route: repair_loop

  block-structure:
    template: command
    name: Block structure (.js + .css per changed block)
    description: >-
      Every changed libs/blocks/<name>/ must contain both <name>.js and
      <name>.css. Catches a block shipped with only one of the pair, which
      renders broken in production even when tests pass.
    cmd: node .fiesta/scripts/check-block-structure.mjs {changed_files}
    blocking: true
    failure_route: repair_loop

  adversary:
    template: adversary
    name: Adversarial review — independent merge gate (INV-4)
    description: >-
      An independent adversary (different model class, no producer context)
      reviews the diff before merge — required by the acom org floor
      (fiesta config/floors/acom, snapshot in .fiesta/floor/). Skips honestly
      when no adversary model is reachable in dev.
    blocking: true
    failure_route: escalate_to_human

  visual:
    template: visual
    name: Visual evidence (ticket-declared targets)
    # No default page: the surface under review is ticket-scoped. Each ticket
    # declares its capture targets (visual_targets: [{page, mechanism}]);
    # mechanism `pin` serves the branch directly, `overlay` renders a
    # content-bus page with this branch's code via preview.yaml's
    # overlay_pattern.
    # No silent skips: a change with no covering surface (no ticket targets,
    # no catalog fit) escalates to a human instead of skipping - the reviewer
    # decides to grow preview.yaml's surface catalog or accept without
    # evidence. The gate still never invents a URL to screenshot.
    on_missing_target: escalate
    breakpoints: [900, 1200]
    # Record a short clip of each captured target (human evidence only; the
    # vision judge stays on stills).
    video: true
    criteria: >-
      The page renders without layout breakage or overlapping elements at each
      breakpoint, and any restyled block matches the intended design (correct
      spacing, colors, and typography). No visible error or empty states.
      If the target is the preflight demo page, its checks legitimately show
      in-progress "Checking..." states — treat those as expected, not errors.
    require_human: true
    blocking: true
