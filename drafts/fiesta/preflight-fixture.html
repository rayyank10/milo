<!DOCTYPE html>
<html>
  <head>
    <title>Preflight Fixture — fiesta visual gate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,">
    <!--
      A representative milo page for the fiesta preflight surface. It carries
      real images so the Assets checks have rows to render; the fork homepage
      has none, which made every asset criterion unsatisfiable there.

      The modal is NOT opened here. The surface's interact steps simulate the
      sidekick contract (aem-sidekick element + sidekick-ready + custom:preflight)
      so milo's own wiring renders it, the same as on any real page.

      Bootstraps like a real milo page (global styles.css + setConfig + loadArea
      with the production typekit id) so captures show the true style context.
      Deliberately NOT preloaded: the c2 token sheets (libs/c2/styles). Real
      pages don't carry them, so preflight must bring its own tokens or literal
      fallbacks; this surface has to be able to catch that defect, not mask it.
    -->
    <link rel="stylesheet" href="/libs/styles/styles.css"/>
    <script type="module">
      import { setConfig, loadArea } from '/libs/utils/utils.js';

      const config = {
        codeRoot: '/libs',
        contentRoot: '/',
        locales: { '': { ietf: 'en-US', tk: 'hah7vzn.css' } },
      };
      setConfig(config);
      await loadArea();
    </script>
  </head>
  <body>
    <header></header>
    <main>
      <div class="section">
        <h1>Preflight fixture page</h1>
        <p>
          Representative page content with real assets, so the preflight Assets
          checks list actual rows and a capture shows the real overlay context.
        </p>
        <picture>
          <img src="/img/open-graph.png" alt="Milo open graph card" width="800" height="420" loading="eager"/>
        </picture>
        <p>An image displayed below its natural size, so size checks have a mismatch to report.</p>
        <picture>
          <img src="/img/mesh-gradient.jpg" alt="Mesh gradient artwork" width="370" height="500" loading="lazy"/>
        </picture>
        <p>A portrait image near its natural size.</p>
        <picture>
          <img src="/img/right-pink-gradient.jpg" alt="Pink gradient artwork" width="392" height="1252" loading="lazy"/>
        </picture>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
